name: Build and release

# Every push to main tests and builds the extension, then publishes it as the latest release.
# Download: https://github.com/shanani/attendie/releases/latest/download/attendie-extension.zip
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Stamp the build number into the extension version
        id: version
        run: |
          base=$(node -p "require('./static/manifest.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          node -e "
            const fs = require('fs');
            const path = 'dist/manifest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.version = '$version';
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          "
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Zip the extension
        run: cd dist && zip -r ../attendie-extension.zip .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" attendie-extension.zip \
            --target "$GITHUB_SHA" \
            --title "Attendie $VERSION" \
            --latest \
            --notes "Built from $GITHUB_SHA.

          **Install:** download \`attendie-extension.zip\`, unzip it into a folder you keep, open \`chrome://extensions\`, turn on Developer mode, click **Load unpacked** and choose the folder.

          **Update:** replace the folder's contents with the new zip, then click the reload icon on the Attendie card in \`chrome://extensions\`."
